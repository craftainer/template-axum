[workspace]
resolver = "2"
# tests/perf is a separate perf-tier client crate (NFR-0024, docs/adrs/0018)
# -- a workspace member so it gets its own [[bin]] and dependency
# resolution, but never linked into "." itself; see its own Cargo.toml.
members = [".", "tests/perf"]
# Plain `cargo build`/`test`/`llvm-cov` (no `-p`/`--workspace`) still
# operate on "." alone -- tests/perf is explicitly opt-in
# (`cargo run -p template-axum-perf`, see its own README.md), never part
# of the coverage-gated unit/integration run `.pre-commit-config.yaml`'s
# `cargo-llvm-cov` hook drives.
default-members = ["."]

# Rust/axum counterpart to template-fastapi's pyproject.toml -- see
# docs/TEMPLATE.md's "Versions and config" section: every dependency here is
# pinned to an exact patch version (`=x.y.z`), never a range, so Renovate's
# cargo datasource bumps them one at a time and the diff shows exactly what
# changed.
[package]
name = "template-axum"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
publish = false

# Both a library and a binary: src/lib.rs holds every module plus the
# router/state wiring, and src/main.rs is a thin entry point over it. The
# library target is what makes tests/'s integration tier possible at all --
# Cargo integration tests link against a crate's public API, which a
# bin-only package doesn't have (see tests/README.md).
[lib]
name = "template_axum"
path = "src/lib.rs"

[[bin]]
name = "template-axum"
path = "src/main.rs"

[dependencies]
# HTTP framework and async runtime -- phase 1's /health/live route.
axum = { version = "=0.8.9", features = ["json"] }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "signal", "time"] }
tower = "=0.5.3"
tower-http = { version = "=0.7.1", features = ["trace"] }

# Structured JSON logging -- see docs/adrs/0007-structured-json-logging-only.md
# in template-fastapi, ported to this instance's own docs in phase 3.
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["json", "env-filter"] }

# Below this line: not wired up yet (no routes/config use them), but pinned
# now so Cargo.lock already reflects phase 2's real dependency graph -- see
# docs/plans/ for the phase 2 plan that adds the code using them.

# Database ORM/migrations -- phase 2's Postgres-backed CRUD resource.
sea-orm = { version = "=2.0.2", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "postgres-array"] }
sea-orm-migration = { version = "=2.0.2", features = ["runtime-tokio-rustls", "sqlx-postgres"] }

# Cache client -- phase 2's Redis/Valkey-backed caching, and Tier B's
# Redis-backed rate limiting (src/rate_limit.rs): "connection-manager" for a
# long-lived, auto-reconnecting async connection reused across requests
# (rather than opening one per check), "script" for the atomic Lua
# INCR+PEXPIRE the limiter runs.
redis = { version = "=1.7.0", features = ["tokio-comp", "connection-manager", "script"] }

# Object storage client -- phase 2's S3/RustFS-backed file storage.
# default-features off, "rustls" (not in this list) dropped: aws-sdk-s3's
# default "rustls" feature drags in a second, older rustls/webpki copy
# (0.21/0.101, with open RUSTSEC advisories) alongside the current one
# "default-https-client" already pulls in -- see docs/adrs/ once phase 2
# lands the real S3 wiring for the ADR this belongs in.
aws-sdk-s3 = { version = "=1.112.0", default-features = false, features = ["default-https-client", "rt-tokio", "sigv4a", "behavior-version-latest"] }
aws-config = "=1.8.11"

# OIDC/OAuth2 client -- phase 2's Keycloak-backed auth.
openidconnect = "=4.0.1"
oauth2 = "=5.0.0"

# Bearer-token decode/verify against a fetched JWKS (see src/oidc/mod.rs) --
# openidconnect/oauth2 above cover the Authorization Code + PKCE flow the
# frontend runs to obtain a token; this resource-server side needs its own
# JWT decode since openidconnect's own verifier is tied to its own
# authorization-flow-scoped nonce/state, not a bare bearer token on an
# unrelated request.
# "aws_lc_rs": 11.x requires picking a CryptoProvider explicitly (no
# longer implicit), and aws-lc-rs is already in the dependency graph via
# rustls's default backend, so this reuses that copy rather than pulling
# in rust_crypto's separate p256/p384/rsa/ed25519-dalek/sha2/hmac stack.
jsonwebtoken = { version = "=11.0.0", features = ["aws_lc_rs"] }

# HTTP client for OIDC discovery + JWKS fetch, and the OIDC health check --
# default-features off, "rustls" only (0.13 renamed the feature from
# "rustls-tls"), for the same single-rustls-copy reasoning as aws-sdk-s3
# above. "form" is unused by application code but needed by tests/e2e.rs's
# Keycloak Resource Owner Password Credentials grant (application/
# x-www-form-urlencoded), which reuses this same reqwest rather than
# pulling in a second HTTP client crate for one test file.
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls", "form"] }

# Object-safe async trait methods for the health-check registry (see
# src/health/mod.rs) -- native async-fn-in-traits (stable since Rust 1.75)
# isn't dyn-compatible, and HealthRegistry holds a heterogeneous
# Vec<Box<dyn HealthCheck>>.
async-trait = "=0.1.92"

# Concurrent execution of every registered health check (see
# src/health/mod.rs's HealthRegistry::run_all) -- the standard
# join-a-heterogeneous-set-of-futures primitive; tokio itself only offers
# join!/select! for a statically-known, fixed set of futures.
futures = "=0.3.34"

serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
chrono = { version = "=0.4.45", features = ["serde"] }

# XML sibling representation for Hero -- docs/adrs/0014, Tier C item 4.
# "serialize" pulls in the serde-based (de)serializer/deserializer
# (quick_xml::se/de) this app uses directly rather than through a
# hand-rolled wrapper (see that ADR's "why no xml_codec.rs" section).
quick-xml = { version = "=0.42.0", features = ["serialize"] }

# Decodes MODE=mock's unsigned/untrusted-signature bearer tokens (see
# src/oidc/mod.rs::decode_without_verification) -- jsonwebtoken's own
# decode() always verifies a signature, so the mock-mode "trust the
# claims as-is" path needs a bare base64url decode of the JWT payload
# segment instead.
base64 = "=0.22.1"

# MQTT client backing the CRUD event stream (src/events.rs) -- see
# docs/adrs/0016-mqtt-backed-sse-crud-event-stream.md for why rumqttc (pure
# Rust, tokio-native AsyncClient/EventLoop pair) rather than the paho-mqtt C
# bindings. default-features off: rumqttc's default "use-rustls" feature
# pulls in its own rustls/tokio-rustls copy for TLS-to-broker support this
# app doesn't use (the broker is an in-network, plaintext:1883 stack
# service), and keeping a single rustls copy in the graph is the same
# reasoning aws-sdk-s3/reqwest above are configured with.
rumqttc = { version = "=0.25.1", default-features = false }

# Subscriber-id generation for the event stream (src/events.rs): a
# subscriber id is a capability (whoever holds it resumes that persistent
# MQTT session), so it comes from the OS CSPRNG, not a counter. getrandom
# directly rather than uuid/rand -- the id is an opaque string this app
# never parses, so a UUID's formatting/versioning machinery would buy
# nothing over 128 hex-encoded random bits.
getrandom = "=0.4.3"

# Optional OTLP log export (src/telemetry.rs, docs/adrs/0006) -- a second
# tracing_subscriber::Layer, added only when OTEL_EXPORTER_OTLP_ENDPOINT
# is set; ADR 0006's structured-JSON-stdout logging stays the
# unconditional default either way. "logs" only on every crate below (no
# "trace"/"metrics") -- this app emits no spans or metrics, only logs.
# opentelemetry-otlp's "http-proto"/"reqwest-client" (rather than its
# default gRPC/tonic exporter) reuses the `reqwest`+`rustls` stack already
# in this graph instead of pulling in a second HTTP/TLS implementation
# (same reasoning as aws-sdk-s3/reqwest/rumqttc's own feature choices
# above).
opentelemetry = { version = "=0.32.0", default-features = false, features = ["logs"] }
opentelemetry_sdk = { version = "=0.32.1", default-features = false, features = ["logs", "rt-tokio"] }
opentelemetry-otlp = { version = "=0.32.0", default-features = false, features = ["logs", "http-proto", "reqwest-client"] }
opentelemetry-appender-tracing = { version = "=0.32.0", default-features = false }

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }

[profile.release]
# Smaller, faster runner-stage binary at the cost of build time -- worth it
# since builder.sh's dependency-caching layer (see builder-sync-deps.sh)
# means most builds don't recompile the dependency graph anyway.
lto = true
strip = true

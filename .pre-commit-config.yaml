# Run with prek (https://prek.j178.dev/, a Rust, drop-in-compatible
# reimplementation of pre-commit — see CLAUDE.md for why) or with the
# classic `pre-commit` CLI; both read this exact file.
#
# Fast, basic checks run on every commit. Every hook also carries the
# "manual" stage, so `prek run --hook-stage manual --all-files` runs
# everything at once regardless of which git hook would normally trigger
# it. An instance layers its own language-specific hooks (ruff/mypy/
# pytest, cargo fmt/clippy, golangci-lint, eslint/tsc, tflint, ...) onto
# this file's `repos:` list — see docs/TEMPLATE.md's "Checks" section.
default_install_hook_types:
  - pre-commit
  - pre-push
  - commit-msg

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit, manual]
      - id: end-of-file-fixer
        stages: [pre-commit, manual]
      - id: check-yaml
        stages: [pre-commit, manual]
      - id: check-toml
        stages: [pre-commit, manual]
      - id: check-json
        stages: [pre-commit, manual]
      - id: check-added-large-files
        stages: [pre-commit, manual]
      - id: check-merge-conflict
        stages: [pre-commit, manual]
      - id: mixed-line-ending
        stages: [pre-commit, manual]
      - id: debug-statements
        stages: [pre-commit, manual]
      - id: detect-private-key
        stages: [pre-commit, manual]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      # No "manual" stage here, unlike every other hook in this file: this
      # one needs the actual commit-message file git passes at the
      # commit-msg stage, which "prek run --all-files --hook-stage manual"
      # has no equivalent for.
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --check
        entry: cargo fmt --check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, manual]

      - id: cargo-clippy
        name: cargo clippy -- -D warnings
        entry: cargo clippy --all-targets -- -D warnings
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, manual]

      - id: cargo-check
        name: cargo check
        entry: cargo check --all-targets
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push, manual]

      - id: cargo-test
        name: cargo test
        # Runs the unit tier (src/'s colocated `mod tests`) and the
        # integration tier (tests/), which reaches the devcontainer
        # stack's own Postgres and MQTT services -- see tests/README.md.
        entry: cargo test
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push, manual]

      - id: cargo-llvm-cov
        name: cargo llvm-cov (99% line-coverage floor)
        # See docs/adrs/0010-80-percent-line-coverage-floor-via-cargo-llvm-cov.md
        # for why this number rather than template-fastapi's 95%, and
        # docs/nfrs/NFR-0023-test-coverage-gate.md for the requirement
        # this enforces. Raised from 80 to 92 when the integration tier
        # (tests/) landed, from 92 to 97 once that tier was extended to
        # close every gap that didn't have a documented reason to stay
        # open (Keycloak/Redis/a real Postgres health check/MQTT's
        # `build_event_bus` branch), and from 97 to 99 once the
        # near-100% coverage pass closed almost every remaining item on
        # that list, including Mode::Dev's own S3/Redis/Oidc health
        # checks and the MQTT poll-error branches (dependency injection
        # via `events::MqttPoll`) -- this hook now also needs the
        # devcontainer stack's S3/RustFS running, alongside Postgres,
        # Redis, MQTT and Keycloak.
        entry: cargo llvm-cov --fail-under-lines 99
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push, manual]
        # cargo-llvm-cov + the llvm-tools-preview rustup component are
        # installed by scripts/develop.d/10-rust.sh.

      - id: cargo-audit
        name: cargo audit (dependency vulnerabilities)
        entry: cargo audit
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push, manual]

      - id: template-sync-manifest
        name: template-sync-manifest (every tracked path classified)
        entry: python3 .github/scripts/template_sync_manifest.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, manual]

      - id: devcontainer-lock
        name: devcontainer-lock (lockfile matches devcontainer.json features)
        entry: python3 .github/scripts/check_devcontainer_lock.py
        language: system
        files: ^\.devcontainer/devcontainer(-lock)?\.json$
        pass_filenames: false
        stages: [pre-commit, manual]

      - id: check-layering
        name: check-layering (src/'s generic/hero split and layer order)
        entry: python3 .github/scripts/check_layering.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, manual]

  # template-docker's image-layer hooks (docs/TEMPLATE.md's "Image layer").
  - repo: local
    hooks:
      # Official hadolint image, pinned (a regex manager in renovate.json
      # tracks the tag); docker_image runs it with the repo mounted, so no
      # host install is needed. Fails on warning and above, not info: the
      # base-owned devcontainer Dockerfile trips info-level DL3066. There is no repo-wide
      # DL3008 (pin apt package versions) ignore: where a pin would break rebuilds, add a
      # per-line `# hadolint ignore=DL3008` with a reason.
      - id: hadolint
        name: hadolint (Dockerfile lint)
        entry: hadolint/hadolint:v2.15.1 hadolint --failure-threshold warning
        language: docker_image
        files: ^(\.devcontainer/)?Dockerfile$
        stages: [pre-commit, manual]

      # The toolchain version ARGs must match between the devcontainer image
      # and the runtime image. An instance appends its own ARG names (e.g.
      # RUST_VERSION) to this entry.
      - id: check-dockerfile-versions
        name: check-dockerfile-versions (ARG defaults match across Dockerfiles)
        entry: bash scripts/check-dockerfile-versions.sh DEBIAN_VERSION
        language: system
        # Also when the check itself, or this entry (the ARG list), changes.
        files: ^((\.devcontainer/)?Dockerfile|scripts/check-dockerfile-versions\.sh|\.pre-commit-config\.yaml)$
        pass_filenames: false
        stages: [pre-commit, manual]

      # Vulnerability scan of the built image tar for the current
      # RELEASE_VERSION/RELEASE_ARCH in dist/ with Trivy (ADR 0001; the Trivy
      # pin and why are in scripts/image-scan.sh). Manual stage only: it needs
      # `make build` to have produced the tar and network for the
      # vulnerability DB. Skips cleanly with no tar.
      - id: image-scan
        name: image-scan (Trivy, HIGH/CRITICAL with a fix)
        entry: bash scripts/image-scan.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]

      # RUST_VERSION lives in the runtime Dockerfile (builder stage) and in
      # scripts/develop.d/10-rust.sh (devcontainer), which can't share an
      # ARG: .devcontainer/Dockerfile is template-owned. Cargo.toml's
      # rust-version must be that version's major.minor.
      - id: check-rust-version
        name: check-rust-version (Dockerfile, devcontainer hook, Cargo.toml agree)
        entry: bash scripts/check-rust-version.sh
        language: system
        files: ^(Dockerfile|Cargo\.toml|scripts/develop\.d/10-rust\.sh)$
        pass_filenames: false
        stages: [pre-commit, manual]

      # Offline tests of the scripts and Makefile logic above (repo
      # derivation, version-check edge cases, smoke-test failure on a missing
      # tar); needs no Docker.
      - id: image-scripts-test
        name: image-scripts-test (Makefile and scripts/ behaviour)
        entry: bash scripts/test-image-scripts.sh
        language: system
        files: ^(Makefile|scripts/(check-dockerfile-versions|image-scan|image-smoke|skopeo|test-image-scripts)\.sh)$
        pass_filenames: false
        stages: [pre-commit, manual]

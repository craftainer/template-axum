# Perf tier (NFR-0024 tiers, NFR-0030 reporting, docs/adrs/0018,
# tests/perf/README.md): builds the runner-stage image, runs it under
# MODE=mock (self-contained -- no backing-service stack needed) capped at
# 1 vCPU / 2 GB like the real-stack mode, and drives tests/perf against it.
# Uploads goose's HTML report and the JSON summary (schema in
# tests/perf/README.md) as artifacts. The real-stack mode
# (tests/perf/run-real-stack.sh) needs the devcontainer's
# Postgres/Redis/MQTT/Keycloak and is deliberately not run here; its
# numbers are taken on the devcontainer host, in a quiet window.
# Manually triggered only -- a load test is neither fast nor free enough
# to run on every push/PR the way checks.yml's own suite does.
name: Perf

on:
  workflow_dispatch:
    inputs:
      users:
        description: Concurrent simulated users
        type: string
        default: "20"
      run_time:
        description: How long to sustain load (goose --run-time, e.g. 60s, 5m)
        type: string
        default: 60s
      startup_time:
        description: Warm-up ramp excluded from the figures (goose --startup-time)
        type: string
        default: 10s

permissions:
  contents: read

jobs:
  perf:
    # renovate: datasource=github-runners depName=ubuntu
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build the runner image
        run: docker build --target runner -t template-axum:perf .

      - name: Start the target container (MODE=mock, self-contained)
        run: |
          docker run -d --name template-axum-perf-target \
            -p 8000:8000 \
            --cpus 1 --memory 2g --memory-swap 2g \
            -e MODE=mock -e ALLOW_MOCK_MODE=1 \
            -e RATE_LIMIT_HERO_WRITE_PER_MINUTE=1000000 \
            -e RATE_LIMIT_MOCK_TOKEN_PER_MINUTE=1000000 \
            template-axum:perf

          for _ in $(seq 1 30); do
            if curl --fail --silent --max-time 5 http://localhost:8000/health/live; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::target container never became healthy"
          docker logs template-axum-perf-target || true
          exit 1

      # Runs tests/perf inside the exact pinned Rust toolchain image the
      # Dockerfile's own `builder` stage uses (its RUST_VERSION/
      # DEBIAN_VERSION ARG defaults, read here rather than re-pinned a
      # second time -- docs/TEMPLATE.md's "Versions and config"),
      # avoiding both a second version pin and this runner's own
      # (unpinned) default Rust install. --network host so the
      # containerized cargo process reaches the target container's
      # published :8000 via localhost.
      - name: Unit-test the load-test client
        run: |
          rust_version=$(grep -m1 '^ARG RUST_VERSION=' Dockerfile | cut -d= -f2)
          debian_version=$(grep -m1 '^ARG DEBIAN_VERSION=' Dockerfile | cut -d= -f2)
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace \
            -v cargo-registry-cache:/usr/local/cargo/registry \
            "rust:${rust_version}-slim-${debian_version}" \
            cargo test -p template-axum-perf

      # The target's cgroup directory is mounted read-only so the client
      # can sample its cpu.stat; if the runner does not expose it the
      # summary just has no cpu numbers.
      - name: Run the load test
        env:
          PERF_USERS: ${{ inputs.users }}
          PERF_STARTUP_TIME: ${{ inputs.startup_time }}
          PERF_RUN_TIME: ${{ inputs.run_time }}
        run: |
          rust_version=$(grep -m1 '^ARG RUST_VERSION=' Dockerfile | cut -d= -f2)
          debian_version=$(grep -m1 '^ARG DEBIAN_VERSION=' Dockerfile | cut -d= -f2)
          cgroup_args=()
          if cgroup_dir=$(tests/perf/cgroup-path.sh template-axum-perf-target); then
            cgroup_args=(-v "$cgroup_dir:/app-cgroup:ro" -e PERF_CGROUP_CPU_STAT=/app-cgroup/cpu.stat)
          else
            echo "::warning::cannot locate the target's cgroup; the summary has no cpu numbers"
          fi
          docker run --rm --network host \
            -e PERF_SUMMARY_FILE=/workspace/perf-summary.json \
            -e PERF_GIT_SHA="$GITHUB_SHA" -e PERF_IMAGE=template-axum:perf \
            -e PERF_CPUS=1 -e PERF_MEMORY=2g \
            "${cgroup_args[@]}" \
            -v "$PWD:/workspace" -w /workspace \
            -v cargo-registry-cache:/usr/local/cargo/registry \
            "rust:${rust_version}-slim-${debian_version}" \
            cargo run -p template-axum-perf --release -- \
              --host http://localhost:8000 \
              --users "$PERF_USERS" \
              --startup-time "$PERF_STARTUP_TIME" \
              --run-time "$PERF_RUN_TIME" \
              --report-file goose-report.html

      - name: Upload the goose report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: goose-report
          path: goose-report.html
          if-no-files-found: ignore

      - name: Upload the JSON summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-summary
          path: perf-summary.json
          if-no-files-found: ignore

      - name: Stop the target container
        if: always()
        run: docker rm -f template-axum-perf-target || true

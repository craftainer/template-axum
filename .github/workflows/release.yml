# Manually-triggered SemVer release: computes the tag/version, then runs
# the instance's own Makefile release contract (build/sbom/release-assets/
# publish -- see docs/TEMPLATE.md's "Release: a Makefile contract" section)
# and creates a GitHub release with everything the instance's Makefile
# populated into dist/.
name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Release channel
        type: choice
        required: true
        options:
          - alpha
          - beta
          - rc
          - full
      bump:
        description: >-
          SemVer 2 part to increase. Use "none" to keep the current base
          version — e.g. to add another alpha/beta/rc to an existing
          series, or to promote one straight to a full release.
        type: choice
        required: true
        options:
          - major
          - minor
          - patch
          - none

permissions:
  contents: write

jobs:
  version:
    # renovate: datasource=github-runners depName=ubuntu
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          python3 .github/scripts/compute_next_version.py \
            --bump "${{ inputs.bump }}" \
            --release-type "${{ inputs.release_type }}" \
            >> "$GITHUB_OUTPUT"

  release:
    needs: version
    # renovate: datasource=github-runners depName=ubuntu
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      # Each target is the instance's own responsibility -- see
      # docs/TEMPLATE.md's "Release: a Makefile contract" section for what
      # each one is expected to do. A repo with nothing to build/publish
      # (e.g. most infra-only instances) still implements each target,
      # even as a no-op, so this workflow never needs an instance-specific
      # branch.
      - name: Build release artifact(s)
        run: make build

      # NFR-0010's release smoke-test gate: before a release counts as
      # verified, the runner image (never dev/mock -- see tests/perf/
      # README.md's identical reasoning) must actually boot against real
      # Postgres/Redis/S3/Keycloak and report healthy. Uses the root
      # compose.yml (see its own header comment for why MQTT/Selenium
      # aren't part of it).
      - name: Start Postgres/Redis/S3/Keycloak for the smoke test
        run: |
          echo "SMOKE_PROJECT=release-smoke-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
          docker compose -p "release-smoke-${{ github.run_id }}-${{ github.run_attempt }}" \
            -f compose.yml \
            up -d --wait

      - name: Smoke-test the release image against real backing services
        run: |
          docker run -d --name release-smoke \
            --network "${SMOKE_PROJECT}_default" \
            -p 8000:8000 \
            --env-file .devcontainer/stack/postgres/postgres.env \
            --env-file .devcontainer/stack/s3/s3.env \
            --env-file .devcontainer/stack/keycloak/keycloak.env \
            -e MODE=dev \
            -e POSTGRES_HOST=postgres \
            -e POSTGRES_PORT=5432 \
            -e S3_ENDPOINT_URL=http://s3:9000 \
            -e REDIS_URL=redis://redis:6379/0 \
            "template-axum:${RELEASE_VERSION}"

          # 5s interval/timeout, 30 retries -- a 150s start period, matching
          # this gate's own spec (docs/nfrs/NFR-0010-release-smoke-test-gate.md).
          healthy=false
          for _ in $(seq 1 30); do
            if curl --fail --silent --max-time 5 http://localhost:8000/health/ready; then
              healthy=true
              break
            fi
            sleep 5
          done

          if [ "$healthy" != "true" ]; then
            echo "::error::template-axum:${RELEASE_VERSION} never reported healthy at /health/ready"
            docker logs release-smoke || true
            exit 1
          fi

      - name: Tear down the smoke-test stack
        if: always()
        run: |
          docker rm -f release-smoke || true
          docker compose -p "${SMOKE_PROJECT}" \
            -f compose.yml \
            down --volumes --remove-orphans

      - name: Generate SBOM(s)
        run: make sbom

      - name: Populate release assets
        run: make release-assets

      - name: Publish
        run: make publish

      # Lets `gh` create the tag itself (from the checked-out commit) and
      # the release in one step, using GitHub's own "generate release
      # notes" changelog — the same one the web UI's button produces.
      # Every file `make release-assets` left in dist/ is attached.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ needs.version.outputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG=--prerelease
          else
            PRERELEASE_FLAG=
          fi
          shopt -s nullglob
          assets=(dist/*)
          gh release create "${{ needs.version.outputs.tag }}" \
            "${assets[@]}" \
            --title "${{ needs.version.outputs.tag }}" \
            --target "${{ github.sha }}" \
            --generate-notes \
            $PRERELEASE_FLAG

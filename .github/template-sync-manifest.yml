# Classifies every path tracked in this repo into exactly one template-sync
# tier, read by ../workflows/template-sync.yml from the template's tagged ref
# being synced *to* (never from an instance's own copy) -- see
# ../workflows/README.md's "Template sync" section for the tier semantics and
# ../scripts/README.md for the checker that keeps this file exhaustive.
#
# A path matching a "replace" pattern that an instance has locally deleted or
# renamed is recreated on the next sync -- that's inherent to "replace" (byte-
# for-byte, unconditional), not a bug to work around here; an instance that
# wants a template-owned path gone for good should move its pattern to
# "ignore" in a template release rather than deleting the file locally.
#
# This is template-base's own manifest, classifying the generic subset it
# ships. A repo that's itself both an instance of template-base and its own
# template for further instances (e.g. template-fastapi) keeps a completely
# separate manifest of its own, covering its own (larger) tracked-file set --
# see that repo's docs/TEMPLATE.md.
#
# Patterns: a trailing "/" matches the directory and everything under it; "*"
# matches any run of characters (including "/"); anything else is an exact
# path. Every pattern here is anchored at the repo root.

replace:
  # Devcontainer, editor, CI, and CLI-assistant config -- no instance ever
  # has a reason to diverge from the template's own setup for these.
  # .claude/ in particular: if an instance ever needs to add its own
  # permissions/hooks to .claude/settings.json, that one file (not the
  # whole directory) should move to "merge" in a template release, rather
  # than losing replace-tier sync for .claude/'s other, still-generic
  # contents.
  - .devcontainer/
  - .vscode/
  - .claude/
  - .github/workflows/
  - .github/scripts/
  - .github/CONTENTS.md
  - .github/renovate.json
  - .github/template-sync-manifest.yml
  - .github/ISSUE_TEMPLATE/
  - .github/PULL_REQUEST_TEMPLATE.md

  # Build/dependency/hook plumbing, all instance-agnostic. Dockerfile and
  # scripts/ are NOT here -- see "ignore" below for why this instance
  # diverges from template-base's generic single-stage versions.
  - .dockerignore
  - .gitattributes
  - .gitignore
  - .pre-commit-config.yaml
  - .mcp.json
  - .secrets/README.md
  - .secrets/.gitkeep

  # The AI-assisted workflow, and every directory README/template documenting
  # this repo's own conventions rather than product knowledge.
  - CLAUDE.md
  - docs/TEMPLATE.md
  - docs/README.md
  - docs/adrs/README.md
  - docs/adrs/template.md
  - docs/frs/README.md
  - docs/frs/template.md
  - docs/nfrs/README.md
  - docs/nfrs/template.md
  - docs/plans/README.md
  - docs/plans/template.md

ignore:
  # Each instance chooses its own license and copyright holder.
  - LICENSE

  # The release-artifact contract (see docs/TEMPLATE.md's "Release: a
  # Makefile contract" section) is the whole point that this differs per
  # instance -- template-owned in shape only, never in content.
  - Makefile

  # template-base's Dockerfile/scripts/ ship only a generic single `develop`
  # stage -- this instance's own three-stage develop/builder/runner Rust
  # build (Dockerfile) and its per-stage setup scripts (scripts/) diverge
  # structurally, not just in pinned versions, so a "replace" sync from
  # template-base would destroy them. Instance-owned from the moment this
  # repo added its own Rust toolchain.
  - Dockerfile
  - scripts/

  # This instance's own application, entirely absent from template-base.
  - Cargo.toml
  - Cargo.lock
  - src/
  - tests/
  - .cargo/

  # Product/domain knowledge and working plans: instance-owned from the
  # moment it's instantiated.
  - docs/architecture.md
  - docs/system-design.md
  - docs/glossary.md
  - docs/stakeholders.md
  - docs/adrs/[0-9]*.md
  - docs/frs/FR-*.md
  - docs/nfrs/NFR-*.md
  - docs/plans/[0-9]*.md

  # Instance-owned bookkeeping, written only by the sync workflow itself.
  - .github/template-sync-state.json

merge:
  # Project identity (name/description) is interpolated per instance;
  # everything else in this file is template-owned.
  - README.md
